name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make && make build/test-unit
      - run: ./tests/run-tests.sh
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make EXTRA="-fsanitize=address,undefined -fno-omit-frame-pointer"
      - run: make EXTRA="-fsanitize=address,undefined -fno-omit-frame-pointer" build/test-unit
      - run: ./tests/run-tests.sh
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make && make build/test-unit
      - run: ./tests/check-docs.sh
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: "6.0.13"
          actions-cache-folder: emsdk-cache
      - run: sh wasm/build.sh
      - run: node tests/wasm-smoke.js
      - name: committed demo artifacts must match a fresh build
        run: git diff --exit-code --stat docs/
