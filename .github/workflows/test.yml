name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make && make build/test-unit
      - run: ./tests/run-tests.sh
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make EXTRA="-fsanitize=address,undefined -fno-omit-frame-pointer"
      - run: make EXTRA="-fsanitize=address,undefined -fno-omit-frame-pointer" build/test-unit
      - run: ./tests/run-tests.sh
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make && make build/test-unit
      - run: ./tests/check-docs.sh
